name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The installer queries the GitHub API; authenticate so shared runners
      # don't hit the anonymous rate limit, and retry transient failures.
      - name: Install the Compact compiler
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pin compiler version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            compact update 0.31.0 && exit 0
            echo "compact update failed (attempt $attempt), retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          exit 1

      - run: npm ci

      - name: Compile contract and ZK circuits
        run: npm run compact

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
